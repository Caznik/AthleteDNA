# Override the base exclusion so Spring Boot auto-configures the DataSource.
spring.autoconfigure.exclude=

spring.datasource.url=jdbc:postgresql://localhost:5432/athletedna
spring.datasource.username=athletedna
spring.datasource.password=athletedna
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# --- Multipart (profile photo upload) ---
# Set above our 2 MB use-case rule so an oversize upload reaches UpdateProfilePhotoService
# and surfaces its own clean 400 instead of the container rejecting the request first.
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=3MB

# --- HikariCP connection pool ---
# Keep a small idle pool and evict connections after 5 minutes idle / 20 minutes lifetime
# to avoid stale connections and reduce DB-side resource usage.
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# --- Hibernate batch inserts ---
# Groups multiple INSERT/UPDATE statements inside one transaction into a single
# round trip instead of N separate statements. The sync endpoint benefits directly
# from this because ActivitiesSyncUseCase wraps the loop in @Transactional.
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
