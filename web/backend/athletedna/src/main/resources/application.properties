spring.application.name=athletedna

# --- Logging / traceability ---
# Print the per-request trace id (set in MDC by TraceIdFilter) right after the level
# on every console line, e.g. "INFO  [trace=1a2b3c4d]". %X{traceId:-} renders empty
# when there is no request in scope (startup, scheduled work).
logging.pattern.level=%5p [trace=%X{traceId:-}]
# Our own code is chatty at DEBUG (outbound Strava calls); keep it at INFO by default.
logging.level.com.caznik.athletedna=INFO

# Default profile: in-memory adapter, no database required.
# Switch to JPA with: --spring.profiles.active=jpa
spring.autoconfigure.exclude=org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration,org.springframework.boot.data.jpa.autoconfigure.DataJpaRepositoriesAutoConfiguration

# Never hold a DB connection open for the entire HTTP request.
# Default is true, which is a significant performance problem for REST APIs.
spring.jpa.open-in-view=false

# --- Strava integration ---
# Secrets come from environment variables; never commit real values.
strava.client-id=${STRAVA_CLIENT_ID:}
strava.client-secret=${STRAVA_CLIENT_SECRET:}
strava.redirect-uri=${STRAVA_REDIRECT_URI:http://localhost:8080/api/strava/callback}
strava.auth-base-url=https://www.strava.com/oauth
strava.api-base-url=https://www.strava.com/api/v3

# --- Frontend ---
# Target for the Strava OAuth callback redirect. Override per environment.
app.frontend-url=${FRONTEND_URL:http://localhost:3000}

# --- Auth / JWT ---
# HS256 signing secret (must be >= 32 bytes). The default is for LOCAL DEV ONLY;
# always override JWT_SECRET in real environments.
jwt.secret=${JWT_SECRET:dev-only-insecure-secret-change-me-32b!}
jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:1440}

# --- Insight engine ---
# Base URL of the Python insight engine and the shared secret sent as X-Internal-Token.
# In docker-compose the engine is reachable at http://insight-engine:8000.
insight-engine.base-url=${INSIGHT_ENGINE_URL:http://localhost:8000}
insight-engine.internal-token=${INSIGHT_ENGINE_TOKEN:}
