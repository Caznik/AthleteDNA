# Test profile for @DataJpaTest slices.
# The base application.properties disables JPA/DataSource autoconfiguration so the
# default runtime uses the in-memory adapter with no database. A @DataJpaTest needs
# those autoconfigurations, so clear the exclusion here and let Spring Boot stand up
# an embedded H2 datasource. H2 regenerates the schema from the entity annotations on
# every run (create-drop), which is exactly what makes ActivityEntityPersistenceTest a
# real guard for the avgHr nullability annotation.
spring.autoconfigure.exclude=

spring.datasource.url=jdbc:h2:mem:athletedna-test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
