services:
  postgres:
    image: postgres:17-alpine
    container_name: athletedna-postgres
    environment:
      POSTGRES_DB: athletedna
      POSTGRES_USER: athletedna
      POSTGRES_PASSWORD: athletedna
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U athletedna -d athletedna"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
